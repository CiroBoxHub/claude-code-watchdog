# fedora_watchdog — configurazione
# Modifica questi valori e tutti gli script si adeguano.

# --- Retention trascrizioni Claude ---
# Trascrizioni (~/.claude/projects/**/*.jsonl) più vecchie di questo
# vengono SEGNALATE come candidate all'archiviazione. Mai cancellate in automatico.
CLAUDE_TRANSCRIPT_RETENTION_DAYS=180

# Dove finiscono gli archivi quando decidi di archiviare
CLAUDE_ARCHIVE_DIR="$HOME/Documenti/Claude/_archivio-trascrizioni"

# --- Retention sottoprodotti Claude (rigenerabili, meno preziosi) ---
CLAUDE_JOBS_RETENTION_DAYS=30
CLAUDE_SHELL_SNAPSHOT_RETENTION_DAYS=14
CLAUDE_FILE_HISTORY_RETENTION_DAYS=30
CLAUDE_PASTE_CACHE_RETENTION_DAYS=14

# --- Sistema ---
JOURNAL_MAX_SIZE="200M"        # tetto per journalctl --vacuum-size
COREDUMP_RETENTION_DAYS=7      # dump dei crash: oltre questa età si buttano
TRASH_RETENTION_DAYS=30        # cestino: elementi più vecchi
USER_CACHE_RETENTION_DAYS=60   # ~/.cache: file non toccati da più di N giorni
KEEP_KERNELS=2                 # quanti kernel tenere installati

# --- Soglie allarme per /watchdog-check ---
# Le due soglie percentuali valgono per TUTTO: colore delle barre nel pannello,
# allarmi negli scan, allarmi nel cruscotto. Averle in un posto solo evita il
# caso in cui la barra è ancora verde mentre l'allarme è già scattato.
ALERT_WARN_PCT=75              # da qui in su: ambra
ALERT_CRIT_PCT=90              # da qui in su: rosso
ALERT_CLAUDE_MB=500            # dimensione ~/.claude oltre la quale segnalare
ALERT_HOME_CACHE_MB=2048       # dimensione ~/.cache oltre la quale segnalare
# La cadenza del cruscotto GNOME sta nelle impostazioni dell'estensione
# (GSettings), non qui: averla in due posti significava che modificarla
# in questo file non aveva alcun effetto.
